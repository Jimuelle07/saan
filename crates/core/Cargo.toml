[package]
name = "saan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Local semantic search, grep and glob engine for the saan launcher"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
ndarray = "0.17"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
pdf-extract = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
